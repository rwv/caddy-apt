name: Build and publish Caddy
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: Optional upstream tag (for example v2.11.9)
        type: string
permissions:
  contents: read
concurrency:
  group: caddy-release
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      plan: ${{ steps.discover.outputs.plan }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: discover
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: echo "plan=$(scripts/discover.sh)" >> "$GITHUB_OUTPUT"
  build:
    needs: discover
    if: fromJSON(needs.discover.outputs.plan).builds[0] != null
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.plan).builds }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.x'
          cache: false
      - id: build
        env:
          PACKAGE: ${{ matrix.package }}
          UPSTREAM: ${{ matrix.upstream }}
          RELEASE_TAG: ${{ matrix.tag }}
        run: |
          echo "artifact_id=${RELEASE_TAG//\//-}" >> "$GITHUB_OUTPUT"
          scripts/build.sh "$PACKAGE" "$UPSTREAM"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: out/*.deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.build.outputs.artifact_id }}-${{ matrix.arch }}
          path: out/*.deb
          if-no-files-found: error
  release:
    needs: [discover, build]
    if: ${{ !cancelled() && needs.discover.result == 'success' && fromJSON(needs.discover.outputs.plan).releases[0] != null }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.plan).releases }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: artifact
        env:
          RELEASE_TAG: ${{ matrix.tag }}
        run: echo "id=${RELEASE_TAG//\//-}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: ${{ steps.artifact.outputs.id }}-*
          path: artifacts
      - env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ matrix.package }}
          RELEASE_TAG: ${{ matrix.tag }}
        run: scripts/release.sh "$PACKAGE" "$RELEASE_TAG"
