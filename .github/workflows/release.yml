name: Build and publish Caddy
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: Optional upstream tag (for example v2.11.9)
        type: string
      publish_apt:
        description: Publish signed APT metadata to R2
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: caddy-release
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.discover.outputs.versions }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: discover
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: echo "versions=$(scripts/discover.sh)" >> "$GITHUB_OUTPUT"
  build:
    needs: discover
    if: needs.discover.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.discover.outputs.versions) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.x'
          cache: false
      - env:
          CADDY_TAG: ${{ matrix.version }}
        run: scripts/build.sh "$CADDY_TAG"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: out/*.deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: debs-${{ matrix.version }}-${{ matrix.arch }}
          path: out/*.deb
          if-no-files-found: error
  release:
    needs: [discover, build]
    if: needs.build.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        version: ${{ fromJSON(needs.discover.outputs.versions) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: debs-${{ matrix.version }}-*
          path: artifacts/${{ matrix.version }}
      - env:
          GH_TOKEN: ${{ github.token }}
          CADDY_TAG: ${{ matrix.version }}
        run: scripts/release.sh "$CADDY_TAG"
  apt:
    needs: [discover, release]
    if: always() && needs.discover.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') && (github.event_name == 'schedule' || inputs.publish_apt)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: sudo apt-get update && sudo apt-get install -y apt-utils
      - env:
          GH_TOKEN: ${{ github.token }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: scripts/publish.sh
