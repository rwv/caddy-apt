name: Publish APT index
on:
  workflow_run:
    workflows: [Build and publish Caddy]
    branches: [main]
    types: [completed]
  schedule:
    - cron: '47 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
  attestations: read
concurrency:
  group: caddy-apt-publish
  cancel-in-progress: false
jobs:
  apt:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      key_expiry: ${{ steps.key.outputs.expiry }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: key
        run: |
          expiry=$(gpg --batch --with-colons --show-keys caddy-apt.gpg | awk -F: '$1=="pub" {print $7}')
          echo "expiry=$expiry" >> "$GITHUB_OUTPUT"
      - run: sudo apt-get update && sudo apt-get install -y apt-utils
      - env:
          GH_TOKEN: ${{ github.token }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: scripts/publish.sh
      - run: scripts/verify.sh
  alert:
    needs: apt
    if: ${{ !cancelled() && (needs.apt.result == 'success' || needs.apt.result == 'failure') }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      APT_RESULT: ${{ needs.apt.result }}
      KEY_EXPIRY: ${{ needs.apt.outputs.key_expiry }}
    steps:
      - name: Report APT publishing status
        run: |
          run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          report() {
            local title=$1 active=$2 message=$3 issue
            issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --search "in:title $title" \
              --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")
            if [[ $active == true && -z $issue ]]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --assignee "$GITHUB_REPOSITORY_OWNER" \
                --body "$message Run: $run_url"
            elif [[ $active == false && -n $issue ]]; then
              gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "Check recovered: $run_url"
            fi
          }

          if [[ $KEY_EXPIRY =~ ^[1-9][0-9]*$ ]]; then
            expiring=false
            if ((KEY_EXPIRY <= $(date +%s) + 30 * 86400)); then
              expiring=true
            fi
            report 'APT signing key expires within 30 days' "$expiring" 'Rotate the APT signing key before it expires.'
          fi

          failed=false
          if [[ $APT_RESULT == failure ]]; then
            previous=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/publish-apt.yml/runs?status=completed&per_page=10" \
              --jq '[.workflow_runs[] | select(.conclusion == "success" or .conclusion == "failure")][0].conclusion')
            if [[ $previous != failure ]]; then
              exit 0
            fi
            failed=true
          fi
          report 'APT index publishing failed twice' "$failed" 'Two consecutive APT publishing runs failed.'
