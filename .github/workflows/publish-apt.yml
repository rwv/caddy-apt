name: Publish APT index
on:
  workflow_run:
    workflows: [Build and publish Caddy]
    branches: [main]
    types: [completed]
  schedule:
    - cron: '47 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
  attestations: read
concurrency:
  group: caddy-apt-publish
  cancel-in-progress: false
jobs:
  apt:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: sudo apt-get update && sudo apt-get install -y apt-utils
      - env:
          GH_TOKEN: ${{ github.token }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: scripts/publish.sh
      - run: scripts/verify.sh
      - name: Signal successful reconciliation
        env:
          APT_HEARTBEAT_URL: ${{ secrets.APT_HEARTBEAT_URL }}
        run: |
          if [[ -n $APT_HEARTBEAT_URL ]]; then
            curl -fsS --max-time 15 --output /dev/null "$APT_HEARTBEAT_URL"
          fi
  alert:
    needs: apt
    if: ${{ failure() && needs.apt.result == 'failure' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Alert on repeated APT failures
        run: |
          previous=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/publish-apt.yml/runs?status=completed&per_page=10" \
            --jq '[.workflow_runs[] | select(.conclusion == "success" or .conclusion == "failure")][0].conclusion')
          if [[ $previous != failure ]]; then
            exit 0
          fi
          title='APT index publishing failed twice'
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --search "in:title $title" \
            --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [[ -z $issue ]]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body "Two consecutive APT publishing runs failed. Latest run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
