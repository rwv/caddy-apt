name: Validate and merge one Caddy plugin update
on:
  workflow_call:
    inputs:
      variant:
        type: string
        required: true
      verify_current:
        type: boolean
        required: true
jobs:
  propose:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      sha: ${{ steps.update.outputs.sha }}
      upstream: ${{ steps.update.outputs.upstream }}
      pr: ${{ steps.update.outputs.pr }}
      base: ${{ steps.update.outputs.base }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.x'
          cache: false
      - id: update
        env:
          GH_TOKEN: ${{ github.token }}
          VARIANT: ${{ inputs.variant }}
          VERIFY_CURRENT: ${{ inputs.verify_current }}
        run: scripts/update-plugin.sh "$VARIANT"
  verify:
    needs: propose
    if: needs.propose.outputs.sha != ''
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.propose.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.x'
          cache: false
      - env:
          VARIANT: ${{ inputs.variant }}
          UPSTREAM: ${{ needs.propose.outputs.upstream }}
        run: |
          scripts/build.sh "caddy-$VARIANT" "$UPSTREAM"
          dpkg-deb -x out/*.deb extracted
          extracted/usr/bin/caddy adapt --config "packaging/smoke/$VARIANT" --adapter caddyfile >/dev/null
  merge:
    needs: [propose, verify]
    if: needs.propose.outputs.pr != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ needs.propose.outputs.pr }}
      TESTED_SHA: ${{ needs.propose.outputs.sha }}
      TESTED_BASE: ${{ needs.propose.outputs.base }}
      UPSTREAM: ${{ needs.propose.outputs.upstream }}
      VARIANT: ${{ inputs.variant }}
    steps:
      - run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ $current != "$TESTED_BASE" ]]; then
            echo 'main changed during validation. The next run will revalidate the update.'
            exit 0
          fi
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$TESTED_SHA"
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f "version=$UPSTREAM" -f "package=caddy-$VARIANT"
